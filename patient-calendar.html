<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f8f7;
            --panel: #ffffff;
            --ink: #182022;
            --muted: #5e6a6d;
            --brand: #0b8f7a;
            --brand-dark: #0a6d5d;
            --accent: #145ea8;
            --line: #d8e1df;
            --good: #0d8a4f;
            --warn: #9a6700;
            --bad: #b3261e;
            --pending: #a05f00;
            --approved: #0b7a43;
            --declined: #8d1c13;
            --cancelled: #6b7280;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Manrope', sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 0% 0%, #d7efe8 0%, transparent 45%),
                radial-gradient(circle at 100% 100%, #dfe9ff 0%, transparent 40%),
                var(--bg);
            min-height: 100vh;
        }

        .app {
            max-width: 1300px;
            margin: 0 auto;
            padding: 24px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 22px;
            border-radius: 16px;
            background: linear-gradient(120deg, #083f4d, #0a5f66 55%, #137b7f);
            color: #f6fcfc;
            box-shadow: 0 18px 34px rgba(8, 63, 77, 0.25);
            margin-bottom: 20px;
        }

        .title {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .subtitle {
            margin: 2px 0 0;
            opacity: 0.88;
            font-size: 0.95rem;
        }

        .btn {
            border: none;
            border-radius: 10px;
            font-weight: 700;
            padding: 10px 14px;
            cursor: pointer;
            transition: transform 140ms ease, opacity 140ms ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }

        .btn-primary {
            background: var(--brand);
            color: #fff;
        }

        .btn-secondary {
            background: #e5eeec;
            color: #1a2e33;
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.26);
        }

        .layout {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 18px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 8px 18px rgba(26, 46, 51, 0.08);
        }

        .card h2,
        .card h3 {
            margin: 0 0 12px;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .month-label {
            font-size: 1.25rem;
            font-weight: 800;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 8px;
        }

        .weekday {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            font-weight: 700;
            padding: 6px;
            text-align: center;
        }

        .day {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 8px;
            min-height: 82px;
            background: #fff;
            cursor: pointer;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .day.muted {
            opacity: 0.45;
        }

        .day.today {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(20, 94, 168, 0.14);
        }

        .day.selected {
            border-color: var(--brand);
            box-shadow: 0 0 0 2px rgba(11, 143, 122, 0.18);
            background: #f2fbf8;
        }

        .day:hover {
            border-color: #89a5a5;
        }

        .day-number {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .slot-count {
            margin-top: 8px;
            font-size: 0.78rem;
            color: var(--accent);
            font-weight: 700;
        }

        .section-title {
            margin: 0 0 8px;
            font-size: 1rem;
            font-weight: 800;
        }

        .slot-list, .appt-list {
            display: grid;
            gap: 10px;
            max-height: 290px;
            overflow: auto;
            padding-right: 4px;
        }

        .slot-item,
        .appt-item {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            background: #fcfffe;
        }

        .slot-item strong,
        .appt-item strong {
            display: block;
            margin-bottom: 4px;
        }

        .slot-meta,
        .appt-meta {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .slot-actions,
        .appt-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: capitalize;
        }

        .status.pending { background: #fff3d8; color: var(--pending); }
        .status.approved { background: #dcfce7; color: var(--approved); }
        .status.declined { background: #fee2e2; color: var(--declined); }
        .status.cancelled { background: #eceef1; color: var(--cancelled); }
        .status.completed { background: #dbeafe; color: #1c4f92; }
        .status.no_show { background: #f3e8ff; color: #6d28d9; }

        .controls {
            display: grid;
            gap: 10px;
            margin-bottom: 12px;
        }

        .controls label {
            font-size: 0.88rem;
            font-weight: 700;
            color: #314448;
        }

        .controls input,
        .controls select,
        .controls textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            font: inherit;
        }

        .controls textarea {
            resize: vertical;
            min-height: 72px;
        }

        .message {
            margin: 12px 0;
            padding: 10px 12px;
            border-radius: 10px;
            font-weight: 600;
            display: none;
        }

        .message.show { display: block; }
        .message.ok { background: #dcfce7; color: var(--good); border: 1px solid #95d7b4; }
        .message.warn { background: #fff6dc; color: var(--warn); border: 1px solid #f3d28a; }
        .message.err { background: #fee2e2; color: var(--bad); border: 1px solid #f0adad; }

        .pill {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            background: #eaf2ff;
            color: #194978;
            font-size: 0.78rem;
            font-weight: 700;
        }

        @media (max-width: 980px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div>
                <h1 class="title">Care Calendar Workspace</h1>
                <p class="subtitle" id="welcomeText">Manage appointments and upcoming sessions.</p>
            </div>
            <div style="display:flex; gap:10px;">
                <button id="backHomeBtn" class="btn btn-ghost" type="button">Back to Site</button>
                <button id="logoutBtn" class="btn btn-ghost" type="button">Sign Out</button>
            </div>
        </header>

        <div id="globalMessage" class="message"></div>

        <section class="layout">
            <article class="card">
                <div class="calendar-header">
                    <button id="prevMonthBtn" class="btn btn-secondary" type="button">Previous</button>
                    <div class="month-label" id="monthLabel">Month Year</div>
                    <button id="nextMonthBtn" class="btn btn-secondary" type="button">Next</button>
                </div>

                <div class="calendar-grid" id="weekdayHeader"></div>
                <div class="calendar-grid" id="calendarGrid"></div>

                <div style="margin-top:14px; display:grid; gap:12px;">
                    <div>
                        <p class="section-title">Available Slots on <span id="selectedDateLabel">Select a date</span></p>
                        <div id="slotList" class="slot-list"></div>
                    </div>
                </div>
            </article>

            <aside style="display:grid; gap:18px;">
                <div class="card">
                    <h3>Book Appointment</h3>
                    <div class="controls">
                        <label for="typeSelect">Appointment Type</label>
                        <select id="typeSelect"></select>
                    </div>
                    <div class="controls">
                        <label for="notesInput">Notes for Provider (optional)</label>
                        <textarea id="notesInput" placeholder="Share any details that help prepare your visit."></textarea>
                    </div>
                    <div style="margin:10px 0;"><span id="selectedSlotPill" class="pill">Select a slot to continue</span></div>
                    <button id="bookBtn" class="btn btn-primary" type="button" disabled>Book Selected Slot</button>
                </div>

                <div class="card" id="appointments">
                    <h3>My Appointments</h3>
                    <div id="appointmentsList" class="appt-list"></div>
                </div>
            </aside>
        </section>
    </div>

    <script src="js/app-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/patient-calendar.js"></script>
</body>
</html>
